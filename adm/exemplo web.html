<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Administração</title>
</head>
<body>
    <!-- Cabeçalho -->
    <header>
        <h1>Cadastro de Usuários</h1>
    </header>
    
    <!-- Menu de Navegação -->
    <nav>
        <a href="index.html">Página Inicial</a>
        <a href="detalhes.html">Detalhes</a>
        <a href="sobre.html">Sobre</a>
        <a href="login.html">Login</a>
        <a href="administracao.html">Admin</a>
    </nav>
    
    <!-- Conteúdo -->
    <main>
        <!-- Página de Cadastro de Usuários -->
        <section id="cadastro-usuario">
            <h2>Área de Cadastro</h2>
            <!-- Formulário de cadastro/edição -->
            <form>
                <div>
                    <label for="usuario">Usuário:</label>
                    <input type="text" id="usuario" name="usuario" required>
                </div>
                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <button type="submit">Cadastrar</button>
            </form>
        </section>

        <!-- Tabela com lista dos usuários cadastrados -->
        <section id="lista-usuarios">
            <h2>Lista de Usuários Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>Email</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Nome 1</td>
                        <td>nome1@example.com</td>
                        <td>
                            <button>Editar</button>
                            <button>Apagar</button>
                        </td>
                    </tr>
                    <tr>
                        <td>Nome 2</td>
                        <td>nome2@example.com</td>
                        <td>
                            <button>Editar</button>
                            <button>Apagar</button>
                        </td>
                    </tr>
                    <!-- Adicione mais linhas para outros usuários cadastrados -->
                </tbody>
            </table>
        </section>
    </main>
    
    <!-- Rodapé -->
    <footer>
        <p><a href="sobre.html">Sobre o Autor</a></p>
        <p>&copy; 2024 Marcio</p>
    </footer>
</body>
</html>
